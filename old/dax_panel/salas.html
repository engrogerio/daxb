<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Salas</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 10px;
      background: #ffffff;
    }

    .table-box {
      border: 2px solid #1f77b4;
      border-radius: 12px;
      padding: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px 10px;
      text-align: left;
    }

    th {
      background-color: #e7f3ff;
      color: #1f77b4;
    }

    h3 {
      margin: 0 0 10px;
      color: #1f77b4;
    }
  </style>
</head>
<body>
  <div class="table-box">
    <h3>Salas</h3>
    <div id="salas-box"></div>
  </div>

  <script>
    async function loadSalas() {
      try {
        const res = await fetch("http://localhost:5000/api/room");
        const data = await res.json();
        const headers = ["SALA", "MÉDICO"];
        let thead = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>`;
        let tbody = "<tbody>";
        data.forEach(row => {
          tbody += `<tr>${headers.map(h => `<td>${row[h]}</td>`).join("")}</tr>`;
        });
        tbody += "</tbody>";
        document.getElementById("salas-box").innerHTML = `<table>${thead}${tbody}</table>`;
      } catch (err) {
        console.error("Erro ao carregar salas:", err);
      }
    }

    loadSalas();
  </script>
</body>
</html>
