{% extends "base.html" %}

{% block title %}Editar Sala{% endblock %}

{% block header %}
  Editar Sala:
{% endblock %}

{% block content %}

    <form action="/room/{{ room.id }}/update-room/" method="post">
      <input type="hidden" name="id" value="{{ room.id }}" >
      <label>Name:</label>
        <input type="text" name="name" value="{{ room.name }}" required><br><br>

      <label>Capacity:</label>
        <input type="number" name="capacity" value="{{ room.capacity }}" required><br><br>

      <label>Doctor Name:</label>
        <input type="text" name="doctor_name" value="{{ room.doctor_name }}" required><br><br>

      <button type="submit">Save</button>
    </form>

{% endblock %}


</body>
</html>
